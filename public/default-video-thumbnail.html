<!DOCTYPE html>
<html>
<head>
  <title>Default Video Thumbnail</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 800px;
      height: 450px;
      background-color: #222;
      overflow: hidden;
    }
    .thumbnail-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .play-button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .play-icon {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 20px 0 20px 35px;
      border-color: transparent transparent transparent #ff7700;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div class="thumbnail-container">
    <div class="play-button">
      <div class="play-icon"></div>
    </div>
  </div>
</body>
</html>
